<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euler Identity Widget</title>
<style>
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#111827;
    color:#f9fafb;
    display:flex;
    justify-content:center;
    padding:20px;
  }
  .wrap{
    width:min(1050px, 96vw);
    background:#1f2937;
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  h1{
    margin:0 0 8px 0;
    text-align:center;
    font-size:1.5rem;
  }
  .sub{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:14px;
    line-height:1.45;
  }
  .controls{
    display:grid;
    grid-template-columns: 1fr 120px 120px;
    gap:12px;
    align-items:center;
    margin-bottom:14px;
  }
  .card{
    background:#111827;
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  label{
    display:block;
    color:#cbd5e1;
    margin-bottom:6px;
    font-weight:bold;
  }
  input[type="range"]{width:100%;}
  button{
    border:none;
    border-radius:12px;
    padding:12px 16px;
    font-size:1rem;
    cursor:pointer;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
    border-radius:12px;
  }
  .note{
    margin-top:10px;
    color:#cbd5e1;
    line-height:1.45;
    font-size:0.95rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Euler Identity: e<sup>iθ</sup> = cosθ + i sinθ</h1>
  <div class="sub">
    The red arrow is the complex number e<sup>iθ</sup>. Its horizontal shadow is cosθ, and its vertical shadow is i sinθ.
  </div>

  <div class="controls">
    <div class="card">
      <label for="thetaSlider">Angle θ</label>
      <input id="thetaSlider" type="range" min="0" max="360" step="1" value="60">
    </div>
    <div class="card" id="thetaVal">60°</div>
    <button id="playBtn">Animate</button>
  </div>

  <canvas id="canvas" width="1000" height="620"></canvas>

  <div class="note">
    The cosine and sine parts are not added as same-direction quantities. They are perpendicular components:
    real part = cosθ, imaginary part = sinθ.
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const slider = document.getElementById("thetaSlider");
  const thetaVal = document.getElementById("thetaVal");
  const playBtn = document.getElementById("playBtn");

  const W = canvas.width;
  const H = canvas.height;
  const cx = 330;
  const cy = 310;
  const R = 210;

  let running = false;
  let lastTime = null;

  function degToRad(d){ return d * Math.PI / 180; }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function arrow(x1,y1,x2,y2,color,width=3){
    const headLen = 14;
    const angle = Math.atan2(y2-y1, x2-x1);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - headLen*Math.cos(angle - Math.PI/6), y2 - headLen*Math.sin(angle - Math.PI/6));
    ctx.lineTo(x2 - headLen*Math.cos(angle + Math.PI/6), y2 - headLen*Math.sin(angle + Math.PI/6));
    ctx.closePath();
    ctx.fill();
  }

  function drawAxes(){
    arrow(cx - R - 35, cy, cx + R + 35, cy, "#374151", 2);
    arrow(cx, cy + R + 35, cx, cy - R - 35, "#374151", 2);

    ctx.fillStyle = "#111827";
    ctx.font = "18px Arial";
    ctx.fillText("Real axis", cx + R - 25, cy + 28);
    ctx.fillText("Imaginary axis", cx + 12, cy - R - 22);

    ctx.font = "15px Arial";
    ctx.fillText("1", cx + R - 5, cy + 22);
    ctx.fillText("-1", cx - R - 15, cy + 22);
    ctx.fillText("i", cx + 10, cy - R + 5);
    ctx.fillText("-i", cx + 10, cy + R + 5);
  }

  function drawUnitCircle(){
    ctx.strokeStyle = "#9ca3af";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2*Math.PI);
    ctx.stroke();
  }

  function drawArc(theta){
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 55, 0, -theta, theta < 0);
    ctx.stroke();
    ctx.fillStyle = "#111827";
    ctx.font = "18px Arial";
    ctx.fillText("θ", cx + 65*Math.cos(theta/2), cy - 65*Math.sin(theta/2));
  }

  function render(){
    const deg = Number(slider.value);
    const theta = degToRad(deg);
    const x = Math.cos(theta);
    const y = Math.sin(theta);

    const px = cx + R*x;
    const py = cy - R*y;

    thetaVal.textContent = `${Math.round(deg)}°`;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "white";
    ctx.fillRect(0,0,W,H);

    drawAxes();
    drawUnitCircle();
    drawArc(theta);

    ctx.setLineDash([8,6]);
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px, cy);
    ctx.stroke();

    ctx.strokeStyle = "#16a34a";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    arrow(px, cy, px, py, "#2563eb", 3);
    arrow(cx, cy, px, py, "#dc2626", 4);

    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, 2*Math.PI);
    ctx.fill();

    ctx.fillStyle = "#111827";
    ctx.font = "20px Arial";
    ctx.fillText("e^(iθ)", px + 12, py - 12);

    ctx.fillStyle = "#16a34a";
    ctx.font = "18px Arial";
    ctx.fillText(`cosθ = ${x.toFixed(3)}`, cx + 20, cy + 55);

    ctx.fillStyle = "#2563eb";
    ctx.fillText(`sinθ = ${y.toFixed(3)}`, px + 12, (cy + py)/2);

    const bx = 650, by = 135;
    ctx.fillStyle = "#f3f4f6";
    ctx.strokeStyle = "#d1d5db";
    ctx.lineWidth = 2;
    roundedRect(bx, by, 300, 260, 16);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#111827";
    ctx.font = "24px Arial";
    ctx.fillText("Euler identity", bx + 65, by + 42);

    ctx.font = "22px Arial";
    ctx.fillText("e^(iθ) = cosθ + i sinθ", bx + 25, by + 88);

    ctx.font = "18px Arial";
    ctx.fillText(`θ = ${Math.round(deg)}° = ${theta.toFixed(3)} rad`, bx + 38, by + 132);
    ctx.fillText(`cosθ = ${x.toFixed(3)}`, bx + 38, by + 170);
    ctx.fillText(`sinθ = ${y.toFixed(3)}`, bx + 38, by + 205);

    ctx.font = "17px Arial";
    const sign = y >= 0 ? "+" : "-";
    ctx.fillText(`e^(iθ) ≈ ${x.toFixed(3)} ${sign} ${Math.abs(y).toFixed(3)}i`, bx + 38, by + 240);

    ctx.fillStyle = "#111827";
    ctx.font = "17px Arial";
    ctx.fillText("Red arrow: whole phasor", 650, 450);
    ctx.fillText("Green: real component", 650, 480);
    ctx.fillText("Blue: imaginary component", 650, 510);
    ctx.fillText("Length of red arrow is always 1", 650, 540);
  }

  function animate(timestamp){
    if(lastTime === null) lastTime = timestamp;
    const dt = (timestamp-lastTime)/1000;
    lastTime = timestamp;

    if(running){
      let v = Number(slider.value);
      v = (v + 40*dt) % 360;
      slider.value = v;
    }
    render();
    requestAnimationFrame(animate);
  }

  playBtn.addEventListener("click", () => {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Animate";
  });

  slider.addEventListener("input", render);
  render();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
