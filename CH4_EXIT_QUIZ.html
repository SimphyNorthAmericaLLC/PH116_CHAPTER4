<!DOCTYPE html><html><head><meta charset="utf-8">
<title>PH116 Exit Quiz</title>
<style>
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#1b2745,#090a0f);color:#f2f2f2;margin:0;padding:24px}
#quiz{max-width:760px;margin:auto;background:#121212;padding:24px;border-radius:18px}
.progress{height:10px;background:#222;border-radius:20px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#00d4ff,#00ff99)}
.opt{display:block;width:100%;margin:8px 0;padding:12px;background:#181818;color:white;border:1px solid #333;border-radius:10px;text-align:left}
.correct{color:#00ff88} .incorrect{color:#ff6666}
</style></head><body>
<div id="quiz"><h1>PH116 Exit Quiz</h1><div>Wave Interference & Diffraction</div>
<div class="progress"><div id="bar"></div></div>
<h3 id="progress"></h3><div id="stem"></div><div id="options"></div><div id="feedback"></div><button id="restart">Restart</button></div>
<script>
const quiz=[
{q:"Euler's identity is written as",o:['e^(itheta) = cos(theta) + i sin(theta)', 'e^(itheta) = sin(theta) + i cos(theta),', 'e^(itheta) = cos(theta) - i sin(theta)', 'e^(itheta)=tan(theta)'],a:0},
{q:'In wave phasor notation, the complex exponential primarily represents',o:['wave speed', 'wave energy', 'amplitude and phase', 'wavelength only'],a:2},
{q:'When adding two coherent wave phasors, the result is obtained by',o:['adding only the amplitudes', 'adding only the phases', 'adding the real and imaginary components separately', 'multiplying the amplitudes'],a:2},
{q:'Constructive interference occurs whenever the path difference equals',o:['(m+1/2)lambda', 'm lambda', 'lambda/4', '2m+1 wavelengths'],a:1},
{q:'Destructive interference occurs whenever the path difference equals',o:['m lambda', '(m+1/2)lambda', 'lambda/3', '2m lambda'],a:1},
{q:'Two coherent waves must have the same',o:['wavelength only', 'amplitude only', 'frequency', 'phase'],a:2},
{q:'In a realistic interference model, the wave amplitude decreases approximately as',o:['r', '1/r', '1/r^2', 'exp(r)'],a:1},
{q:'Including attenuation mainly changes',o:['fringe locations', 'wavelength', 'fringe brightness while leaving locations unchanged', 'wave frequency'],a:2},
{q:"According to Huygens' principle,",o:['only the center emits', 'every point acts as a new wave source', 'diffraction requires two slits', 'only edges emit'],a:1},
{q:'Fresnel diffraction refers to',o:['far-field', 'near-field', 'TIR', 'polarization'],a:1},
{q:'Fraunhofer diffraction is obtained when',o:['screen sufficiently far', 'screen touches slit', 'wavelength zero', 'attenuation neglected'],a:0},
{q:'Under the Fraunhofer approximation, the diffraction integral becomes',o:['nonlinear', 'impossible', 'a Fourier integral', 'independent of wavelength'],a:2},
{q:'Single-slit diffraction amplitude is proportional to',o:['sin(beta)/beta', 'cos(beta)', 'beta^2', 'tan(beta)'],a:0},
{q:'Intensity pattern is proportional to',o:['sin(beta)', '(sin(beta)/beta)^2', 'beta', 'cos^2(beta)'],a:1},
{q:'Increasing slit width makes the central maximum',o:['wider', 'narrower', 'unchanged', 'twice as bright'],a:1},
{q:'Increasing wavelength makes diffraction minima',o:['closer', 'farther apart', 'unchanged', 'random'],a:1},
{q:'Double-slit principal maxima depend primarily on',o:['slit width', 'slit separation', 'number of slits', 'attenuation'],a:1},
{q:'Increasing identical slits makes maxima',o:['wider', 'sharper', 'random', 'fewer'],a:1},
{q:'Envelope of multiple-slit interference is determined by',o:['slit separation', 'single-slit diffraction', 'wavelength', 'screen distance'],a:1},
{q:'Replacing a slit with a circular aperture introduces',o:['Legendre', 'Bessel', 'Hermite', 'exponential'],a:1},
{q:'First Airy minimum occurs near',o:['0.50 lambda/D', '1.22 lambda/D', '2 lambda/D', 'pi lambda/D'],a:1},
{q:'Diffraction grating separates colors because wavelengths have',o:['different reflection', 'different diffraction angles', 'different vacuum frequencies', 'different speeds'],a:1},
{q:'More lines/mm on a grating generally give',o:['better wavelength separation', 'fewer maxima', 'lower frequencies', 'shorter wavelengths'],a:0},
{q:'Gas emission spectra are unique because',o:['all gases identical', 'each element has unique spectrum', 'prisms create wavelengths', 'diffraction changes atoms'],a:1},
{q:'Best summary of diffraction',o:['only sound', 'needs two slits', 'interference of secondary wavelets', 'eliminates interference'],a:2},
];
const progressEl=document.getElementById('progress');
const stemEl=document.getElementById('stem');
const optionsEl=document.getElementById('options');
const feedbackEl=document.getElementById('feedback');
const restartBtn=document.getElementById('restart');
let idx=0,score=0;
function render(){
 document.getElementById('bar').style.width=(idx/quiz.length*100)+'%';
 progressEl.textContent='Question '+(idx+1)+' of '+quiz.length+' · Score: '+score+'/'+quiz.length;
 stemEl.textContent=quiz[idx].q;
 optionsEl.innerHTML='';
 feedbackEl.textContent='';
 const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 quiz[idx].o.forEach((t,i)=>{
   const b=document.createElement('button');
   b.className='opt';
   b.innerHTML='<b>'+letters[i]+')</b> '+t;
   b.onclick=()=>answer(i);
   optionsEl.appendChild(b);
 });
}
function answer(i){
 if(i===quiz[idx].a){
   score++; feedbackEl.className='correct'; feedbackEl.textContent='Correct!';
   setTimeout(()=>{idx++; if(idx<quiz.length) render(); else {
      progressEl.textContent='Completed · Final Score: '+score+'/'+quiz.length;
      stemEl.textContent='Quiz finished.';
      optionsEl.innerHTML='';
      feedbackEl.textContent='Press Restart to try again.';
   } },500);
 } else {
   feedbackEl.className='incorrect';
   feedbackEl.textContent='Incorrect — restarting from Question 1...';
   setTimeout(()=>{idx=0;score=0;render();},700);
 }
}
restartBtn.onclick=()=>{idx=0;score=0;render();};
render();
</script></body></html>
