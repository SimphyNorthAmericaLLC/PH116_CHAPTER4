<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nonlinear Equation Solver</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

<style>
body {
    background-color: #1e1e1e;
    color: white;
    font-family: monospace;
    padding: 15px;
}

.editor {
    display: flex;
    border: 1px solid #444;
    height: 350px;
}

#lineNumbers {
    background: #111;
    color: #00ff00;
    padding: 10px 8px;
    margin: 0;
    text-align: right;
    overflow: hidden;
    white-space: pre;
}

#code {
    flex: 1;
    background: #111;
    color: white;
    border: none;
    padding: 10px;
    resize: none;
    overflow: auto;
    white-space: pre;
}

button {
    margin-top: 10px;
    margin-right: 6px;
    padding: 8px 14px;
    background: #007acc;
    color: white;
    border: none;
    cursor: pointer;
}

#output {
    background: #111;
    padding: 10px;
    margin-top: 10px;
    min-height: 80px;
    white-space: pre-wrap;
}

#plot {
    margin-top: 10px;
    border: 1px solid #555;
    max-width: 100%;
}
</style>
</head>

<body>

<h3>Nonlinear Equation Solver</h3>

<div class="editor">
<pre id="lineNumbers"></pre>
<textarea id="code" wrap="off">import sympy as sp
import numpy as np
import matplotlib.pyplot as plt

import matplotlib
matplotlib.use("Agg")

plt.rcParams.update({
    'figure.facecolor': 'white',
    'axes.facecolor': 'white',
})


# Step 1: Define the variable
x = sp.symbols('x')


# Step 2: Define the nonlinear equation
# We rewrite the equation as f(x)=0
f = sp.sqrt((x+1)**2 - 5) + sp.sqrt((5*x-3)**2 - 1) - 4


# Step 3: Choose several initial guesses
# nsolve needs a starting point
guesses = [-5, -2, -1, 0, 1, 2, 5]


# Step 4: Numerically solve the equation
roots = []

for g in guesses:
    try:
        r = float(sp.nsolve(f, g))

        # Avoid printing the same root twice
        if not any(abs(r - old) < 1e-6 for old in roots):
            roots.append(r)

    except:
        pass


# Step 5: Print results
print("Equation solved:")
sp.pprint(f)
print()

print("Roots found:")
if len(roots) == 0:
    print("No roots found from the selected guesses.")
else:
    for r in roots:
        print("x =", round(r, 8))


# Step 6: Plot f(x)
def F(val):
    try:
        number = f.subs(x, val)
        number = complex(number.evalf())

        if abs(number.imag) < 1e-8:
            return number.real
        else:
            return np.nan

    except:
        return np.nan


x_vals = np.linspace(-5, 5, 1000)
y_vals = [F(val) for val in x_vals]


plt.figure(figsize=(8, 5))

plt.plot(x_vals, y_vals, label="f(x)")
plt.axhline(0, linestyle="--", label="y = 0")

for r in roots:
    plt.plot(r, 0, "o")
    plt.text(r, 0, "  root")

plt.title("Nonlinear Equation Solver")
plt.xlabel("x")
plt.ylabel("f(x)")
plt.grid(True)
plt.legend()

plt.tight_layout()
plt.savefig("plot.png")
plt.savefig("plot.pdf")
plt.savefig("plot.svg")
</textarea>
</div>

<button onclick="runCode()">Run</button>
<button onclick="downloadPlot('png')">Download PNG</button>
<button onclick="downloadPlot('pdf')">Download PDF</button>
<button onclick="downloadPlot('svg')">Download SVG</button>

<div id="output"></div>
<img id="plot"/>

<script>
let pyodideReady = loadPyodide();
let pyodide;

const code = document.getElementById("code");
const lineNumbers = document.getElementById("lineNumbers");

function updateLineNumbers() {
    const lines = code.value.split("\n").length;
    let numbers = "";
    for (let i = 1; i <= lines; i++) numbers += i + "\n";
    lineNumbers.textContent = numbers;
}

code.addEventListener("input", updateLineNumbers);
code.addEventListener("scroll", () => lineNumbers.scrollTop = code.scrollTop);
updateLineNumbers();

async function runCode() {
    pyodide = await pyodideReady;

    document.getElementById("output").innerText = "Running...";
    document.getElementById("plot").src = "";

    await pyodide.loadPackage(["numpy","matplotlib","sympy"]);

    try {
        await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);

        await pyodide.runPythonAsync(code.value);
        let output = await pyodide.runPythonAsync("sys.stdout.getvalue()");
        document.getElementById("output").innerText = output;

        try {
            let img = pyodide.FS.readFile("plot.png", {encoding:"binary"});
            let blob = new Blob([img], {type:"image/png"});
            document.getElementById("plot").src = URL.createObjectURL(blob);
        } catch(e) {}
    } catch(err) {
        document.getElementById("output").innerText = err;
    }
}

function downloadPlot(format) {
    try {
        let file = pyodide.FS.readFile("plot." + format, {encoding:"binary"});
        let blob = new Blob([file], {type:"application/octet-stream"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "nonlinear_equation_solver_plot." + format;
        link.click();
    } catch(err) {
        alert("Run the code successfully first.");
    }
}
</script>

</body>
</html>
